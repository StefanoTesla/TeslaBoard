<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeslaBoard - HOME</title>
</head>

<body x-data="GlobalData()">

    <header>
      <div class="logo"></div>
      <div class="menu">
        <a href="/">
          <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="32px" height="32px"

         c0.552,0,1-0.448,1-1v-10c0-1.105,0.895-2,2-2h5c1.105,0,2,0.895,2,2v10c0,0.552,0.448,1,1,1h10c0.552,0,1-0.448,1-1V21.411

       </svg></a>

      </div>
    </header>

  <template x-if="textLoaded">

    <div class="main_grid">
      <!-- SWITCH AREA -->
      <template x-if="exist.switch">
        <div class="single_grid">
          <div class="single_header" x-on:click="open.switch = ! open.switch">
            <div class="title"><p x-text='text.switch?.title || "{switch-title}"'></p></div>
            <div class="status">
              <div class="led active"></div>
            </div>
            <div class="coll_icon" :class="open.switch ? 'open' : ''">
              <svg fill="currentcolor" width="40px" height="40px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <g data-name="Layer 2"><g data-name="arrowhead-down"><rect width="24" height="24" opacity="0"/>
                <path d="M17.37 12.39L12 16.71l-5.36-4.48a1 1 0 1 0-1.28 1.54l6 5a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.14z"/>
                <path d="M11.36 11.77a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.15L12 9.71 6.64 5.23a1 1 0 0 0-1.28 1.54z"/>
                </g></g></svg>
            </div>
          </div>
          <template x-if="open.switch">
          <div class="sw_grid">
            <template x-for="(sw,index) in swi.Switches">
              <div class="card">
                <div><p class="sw_title" x-text="sw.name"></p></div>
                <div><p class="sw_desc" x-text="sw.desc"></p></div>
                <!-- digital input -->
                <div x-show="sw.type==1">
                  
                  <label class="toggle" :for="'sw_t1_'+index+'_status'">
                    <input class="toggle__input" name="'sw_t1_'+index+'_status'" type="checkbox" :id="'sw_t1_'+index+'_status'" x-model="sw.boValue" disabled>
                    <div class="toggle__fill cursor-not-allowed"></div>
                  </label>
                </div>
           
                <!-- digital output -->
                <div x-show="sw.type==2">
                  <label class="toggle" :for="'sw_t3_'+index+'_status'">
                    <input class="toggle__input" name="'sw_t3_'+index+'_status'" type="checkbox" :id="'sw_t3_'+index+'_status'" x-model="sw.boValue" @change="switchChangeDigital(index)">
                    <div class="toggle__fill"></div>
                  </label>
                </div>
                <!-- pwm servo-->
                <div class="sw_analog" x-show="sw.type==3 || sw.type==4">
                  <div class="range sw_analog">
                    <input type="range" :id="'sw_t45_'+index+'_slider'" :min='sw.min' :max='sw.max' step='1' x-model="sw.intValue" @change="switchChangeValue(index)"/>
                  </div>
                  <div class="sw_value">
                    <p x-text='text.gen.status?.actualValue || "{gen-status-actualValue}"'></p> <span x-text="sw.intValue"></span> / <span x-text="sw.max"></span>
                  </div>
                  
                </div>

              </div>



            </template>
            
          </div>
          </template>  
        </div>
      </template>

      <!-- DOME AREA -->
      <template x-if="exist.dome && load.dome">
        <div class="single_grid">
          <div class="single_header" x-on:click="open.dome = ! open.dome">
            <div class="title">
              <p x-text='text.dome?.title || "{dome-title}"'></p>
            </div>
            <div class="status">
              <div class="led" :class="{
                'green' : dome.status.roofState <= 1,
                'orange' : dome.status.roofState === 2 || dome.status.roofState === 3,
                'red' : dome.status.roofState >= 4 
              }">
              </div>
            </div>
            <div class="coll_icon" :class="open.dome ? 'open' : ''">
              <svg fill="currentcolor" width="40px" height="40px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <g data-name="Layer 2"><g data-name="arrowhead-down"><rect width="24" height="24" opacity="0"/>
                <path d="M17.37 12.39L12 16.71l-5.36-4.48a1 1 0 1 0-1.28 1.54l6 5a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.14z"/>
                <path d="M11.36 11.77a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.15L12 9.71 6.64 5.23a1 1 0 0 0-1.28 1.54z"/>
                </g></g>
              </svg>
            </div>
          </div>
          <template x-if="open.dome">
            <div>
              <div class="card flex">
                <p x-text='text.dome.home?.roofState || "{dome-gen-roofstate}"'></p>
                <span> </span>
                <p x-show="dome.status.roofState === 0" x-text='text.gen.status?.open || "{gen-status-open}"'></p>
                <p x-show="dome.status.roofState === 1" x-text='text.gen.status?.close || "{gen-status-close}"'></p>
                <p x-show="dome.status.roofState === 2" x-text='text.dome.home.shutterState?.opening || "{dome-gen-shutterState-opening}"'></p>
                <p x-show="dome.status.roofState === 3" x-text='text.dome.home.shutterState?.closing || "{dome-gen-shutterState-closing}"'></p>
                <p x-show="dome.status.roofState >= 4" class="red" x-text='text.dome.home.shutterState?.error || "{dome-gen-shutterState-error}"'></p>
              </div>
              <div class="card flex justify-around">
                <button :class="{
                  'disactivated' : dome.status.actualCommand != 0 || dome.status.roofState == 0,
                  'green' :  dome.status.actualCommand == 0 && dome.status.roofState != 0
                 }"
                  x-text='text.gen.action?.open || "{gen-action-open}"' @click="openDome()"></button>
                <button :class="{
                  'disactivated' : dome.status.actualCommand != 0 || dome.status.roofState == 1,
                  'green' :  dome.status.actualCommand == 0 && dome.status.roofState != 1
                 }"
                  x-text='text.gen.action?.close || "{gen-action-close}"' @click="closeDome()"></button>

                <button class="red" x-text='text.gen.action?.halt || "{gen-action-halt}"' @click="haltDome()"></button>
              </div>
              
              <div>
                
              </div>
              
              <div class="card center dome_input">
                <div class="col-span-2">
                  <p class="uppercase font-bold" x-text='text.dome.home?.input || "{dome-home-input}"'></p>
                </div> 
                <div x-text='text.gen.status?.open || "{gen-status-open}"' class="uppercase"></div>
                <div x-text='text.gen.status?.close || "{gen-status-close}"' class="uppercase"></div>
                <div class="led" :class="dome.input.open ? 'green' : 'red'"></div>
                <div class="led" :class="dome.input.close ? 'green' : 'red'"></div>
              </div>
              <div class="card flex flex-col">
                <p x-text='text.dome.home?.actualCommand || "{dome-home-actualCommand}"'></p>
                <span x-show="dome.status.actualCommand === 0" x-text='text.dome.home.shutterCommand?.idle || "{dome-home-shutterCommand-idle}"'></span>
                <span x-show="dome.status.actualCommand === 1" x-text='text.dome.home.shutterState?.opening || "{dome-home-shutterState-opening}"'></span>
                <span x-show="dome.status.actualCommand === 2" x-text='text.dome.home.shutterState?.closing || "{dome-home-shutterState-closing}"'></span>
                <span x-show="dome.status.actualCommand === 3" x-text='text.dome.home.shutterCommand?.halt || "{dome-home-shutterCommand-halt}"'></span>
                <p x-text='text.dome.home?.lastCommand || "{dome-home-lastCommand}"'></p>
                <span x-show="dome.status.lastCommand === 0" x-text='text.dome.home.shutterCommand?.idle || "{dome-home-shutterCommand-idle}"'></span>
                <span x-show="dome.status.lastCommand === 1" x-text='text.dome.home.shutterState?.opening || "{dome-home-shutterState-opening}"'></span>
                <span x-show="dome.status.lastCommand === 2" x-text='text.dome.home.shutterState?.closing || "{dome-home-shutterState-closing}"'></span>
                <span x-show="dome.status.lastCommand === 3" x-text='text.dome.home.shutterCommand?.halt || "{dome-home-shutterCommand-halt}"'></span>
              </div>
            </div>
          </template>
        </div> 
      </template>

        <!-- COVER AREA -->
        <template x-if="exist.coverc && load.cover">
          <div class="single_grid">
            <div class="single_header" x-on:click="open.cover = ! open.cover">
              <div class="title"><p x-text='text.coverC?.title || "{coverc-home-title}"'></p></div>
              <div class="status">
                <div class="led" :class="{
                  'green' : coverC.cover.status == 1 || coverC.cover.status == 3,
                  'orange' :coverC.cover.status == 2,
                  'red' : coverC.cover.status >= 4 
                }"></div>
              </div>
              <div class="coll_icon" :class="open.cover ? 'open' : ''">
                <svg fill="currentcolor" width="40px" height="40px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <g data-name="Layer 2"><g data-name="arrowhead-down"><rect width="24" height="24" opacity="0"/>
                  <path d="M17.37 12.39L12 16.71l-5.36-4.48a1 1 0 1 0-1.28 1.54l6 5a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.14z"/>
                  <path d="M11.36 11.77a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.15L12 9.71 6.64 5.23a1 1 0 0 0-1.28 1.54z"/>
                  </g></g></svg>
              </div>
            </div>
            <template x-if="open.cover">
            <div>
              <div x-show="coverC.calibrator.status > 0" class="card">
                <p x-text='text.coverC?.calibrator || "{coverc-calibrator}"' class="font-semibold pb-4"></p>
                <div class="range">
                  <input type="range" min='0' max='4095' step='1' x-model="coverC.calibrator.brightness" @change="calibratorBrightness(coverC.calibrator.brightness)" />
                </div>
                <p x-text='text.gen.status?.actualValue || "{gen-status-actualValue}"'></p> <span x-text="coverC.calibrator.brightness"></span> / 4095
                <div class="flex justify-around w-full">
                  <button @click="calibratorOff()" :class="{
                    'disactivated' : coverC.calibrator.brightness == 0,
                    'green' : coverC.calibrator.brightness > 0
                   }" x-text='text.gen.action?.powerOff || "{gen-action-powerOff}"'></button>
                  <button @click="calibratorOn()" :class="{
                    'disactivated' : coverC.calibrator.brightness >= 4095,
                    'green' : coverC.calibrator.brightness <= 4095
                   }"  x-text='text.gen.action?.powerOn || "{gen-action-powerOn}"'></button>
                </div>
              </div>

              <div x-show="coverC.cover.status > 0" class="card">
                <p x-text='text.coverC?.cover || "{coverC-cover}"' class="font-semibold pb-4"></p>
                <div class="content">
                  <div class="flex">
                    <p x-text='text.coverC.home?.coverState || "{coverC-home-coverState}"'></p>
                    <span x-show="coverC.cover.status === 1" x-text='text.gen.status?.close || "{gen-status-close}"'></span>
                    <span x-show="coverC.cover.status === 2" x-text='text.coverC.home.coverEnum?.moving || "{coverC-home-coverEnum-moving}"'></span>
                    <span x-show="coverC.cover.status === 3" x-text='text.gen.status?.open || "{gen-status-open}"'></span>
                    <span x-show="coverC.cover.status === 4" x-text='text.coverC.home.coverEnum?.unknow || "{coverC-home-coverEnum-unknow}"'></span>
                    <span x-show="coverC.cover.status === 5" x-text='text.coverC.home.coverEnum?.error || "{coverC-home-coverEnum-error}"'></span>
                  </div>
                  <div class="flex justify-around w-full">
                    <button @click="coverClose()" :class="{
                      'disactivated' : coverC.cover.status == 1 || coverC.cover.status == 2,
                      'green': coverC.cover.status != 1 
                     }" x-text='text.gen.action?.close || "{gen-action-close}"' ></button>
                    <button @click="coverOpen()" :class="{
                      'disactivated' : coverC.cover.status == 3 || coverC.cover.status == 2,
                      'green' : coverC.cover.status != 3
                     }" x-text='text.gen.action?.open || "{gen-action-open}"'></button>
                  </div>
                  <div class="flex">
                    <p x-text='text.gen.status?.actualPos || "{gen-status-actualPos}"'></p><span x-text="coverC.cover.angle"></span><span>°</span>
                  </div>


                </div>
              </div>
    
            </div>
          </template>
          </div>
        </template>

            <!-- STATISTICS AREA -->
            <div class="single_grid">
              <div class="single_header" x-on:click="open.statistics = ! open.statistics">
                <div class="title"><p>Statistiche</p></div>
                <div class="status">
                  <div class="led" :class="{
                    'green' : !version.upgrade,
                    'orange' : version.upgrade, 
                  }"></div>
                </div>
                <div class="coll_icon" :class="open.statistics ? 'open' : ''">
                  <svg fill="currentcolor" width="40px" height="40px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <g data-name="Layer 2"><g data-name="arrowhead-down"><rect width="24" height="24" opacity="0"/>
                    <path d="M17.37 12.39L12 16.71l-5.36-4.48a1 1 0 1 0-1.28 1.54l6 5a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.14z"/>
                    <path d="M11.36 11.77a1 1 0 0 0 1.27 0l6-4.83a1 1 0 0 0 .15-1.41 1 1 0 0 0-1.41-.15L12 9.71 6.64 5.23a1 1 0 0 0-1.28 1.54z"/>
                    </g></g></svg>
                </div>
              </div>
              <template x-if="open.statistics">
              <div>
                <div class="card">
                  <p class="text-center font-bold mb-4">WiFi</p>
                  <div class="setting_table">
                    <div class="row">                    
                      <p x-text='text.board.home.wifi?.ssdi || "{board-home-wifi-ssdi}"'>:</p>
                      <p x-text="board.wifi.ssid"></p>
                    </div>
                    <div class="row">                    
                      <p x-text='text.board.home.wifi?.db || "{board-home-wifi-db}"'></p>
                      <p x-text="board.wifi.db"></p>
                      <p> db</p>
                    </div>
                    <div class="row">
                      <p>IP:</p>
                      <p x-text="board.wifi.ip"></p>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.wifi?.macAddress || "{board-home-wifi-macAddress}"'></p>
                      <p x-text="board.wifi.mac"></p>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.uptime?.from || "{board-home-uptime-from}"'></p>
                      <p>
                        <span x-show="board.wifi.days > 0">
                          <span x-text="board.wifi.days"></span>
                          <span x-text='text.board.home.uptime?.days || "{board-home-uptime-days}"'></span>
                        </span>
                        <span x-show="board.wifi.days > 0 || board.wifi.hours > 0">
                          <span x-text="board.wifi.hours"></span>
                          <span x-text='text.board.home.uptime?.hours || "{board-home-uptime-hours}"'></span>
                        </span>
                        <span>
                          <span x-text="board.wifi.minutes"></span>
                          <span x-text='text.board.home.uptime?.minutes || "{board-home-uptime-minutes}"'></span>
                        </span>
                      </p>
                    </div>

                  </div>
                </div>
                <div class="card">
                  <p class="text-center font-bold mb-4">CPU</p>
                  <div class="setting_table">
                    <div class="row">
                      <p>CPU:</p>
                      <span x-text="board.board.cpu"></span>
                      <span> REV:</span>
                      <span x-text="board.board.rev"></span>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.cpu?.cores || "{board-home-cpu-cores}"'></p>
                      <p x-text="board.board.cores"></p>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.cpu?.speed || "{board-home-cpu-speed}"'></p>
                      <p>
                        <span x-text="board.board.freq"></span>
                        <span> MHz</span>
                      </p>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.uptime?.from || "{board-home-uptime-from}"'></p>
                      <p>
                        <span x-show="board.board.days > 0">
                          <span x-text="board.board.days"></span>
                          <span x-text='text.board.home.uptime?.days || "{board-home-uptime-days}"'></span>
                        </span>
                        <span x-show="board.board.days > 0 || board.board.hours > 0">
                          <span x-text="board.board.hours"></span>
                          <span x-text='text.board.home.uptime?.hours || "{board-home-uptime-hours}"'></span>
                        </span>
                        <span>
                          <span x-text="board.board.minutes"></span>
                          <span x-text='text.board.home.uptime?.minutes || "{board-home-uptime-minutes}"'></span>
                        </span>
                      </p>

                    </div>
                    <div class="row">
                      <p x-text='text.board.home.memory?.total || "{board-home-memory-total}"'></p>
                      <p x-text="board.memory.heapSize"></p>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.memory?.free || "{board-home-memory-free}"'></p>
                        <p x-text="board.memory.freeHeap"></p>
                        <p>(<span x-text="board.memory.freeHeapPerc"></span> %)</p>

                    </div>
                    <div class="row">
                      <p x-text='text.board.home.memory?.minFree || "{board-home-memory-minFree}"'></p>
                        <p x-text="board.memory.minHeap"></p>
                        <p>(<span x-text="board.memory.minHeapPerc"></span> %)</p>
                    </div>
                  </div>
                </div>
                <div class="card">
                  <p class="text-center font-bold mb-4">Timer</p>
                  <ul>                
                  <template x-for="(ch,index) in board.pwm">
                    <li><span x-text='text.board.home.timers?.channel || "{board-home-timers-channel}"'>Channel </span><span x-text="index"></span>
                      <span> - </span>
                      <span x-text="text.board.home.timers.channels[ch]"></span>
                    </li>
                  </template>
                </ul>
                </div>
                <div class="card">
                  <p x-text='text.board.home.update?.title || "{board-home-update-title}"' class="text-center font-bold mb-4"><div class="led" :class="{ 'red' : version.upgrade,  }"></div></p>                  
                  <div class="setting_table">
                    <div class="row">
                      <p x-text='text.board.home.update?.actual || "{board-home-update-actual}"'>Actual:</p>
                      <span x-text="version.actual"></span>
                    </div>
                    <div class="row">
                      <p x-text='text.board.home.update?.available || "{board-home-update-available}"'>Available:</p>
                      <span x-text="version.available"></span>
                    </div>
                    <div class="row">
                      <button class="green" x-text='text.board.home.update?.check || "{board-home-update-check}"' @click="checkFWUpdate()"></button>
                    </div>
                </div>
              </div>
              </div>
            </template>
            </div>
        <!-- TOAST -->
        <div
        class="fixed inset-0 flex flex-col-reverse items-end justify-start h-screen w-screen"
        @notice.window="addToast($event.detail)"
        style="pointer-events:none">
        <template x-for="notice of notices" :key="notice.id">
          <div
            x-show="visible.includes(notice)"
            x-transition:enter="transition ease-in duration-200"
            x-transition:enter-start="transform opacity-0 translate-y-2"
            x-transition:enter-end="transform opacity-100"
            x-transition:leave="transition ease-out duration-500"
            x-transition:leave-start="transform translate-x-0 opacity-100"
            x-transition:leave-end="transform translate-x-full opacity-0"
            @click="removeToast(notice.id)"
            class="rounded mb-4 mr-6 w-60 pl-4 flex items-center justify-center text-white shadow-lg font-bold text-lg cursor-pointer"
            :class="{
              'bg-green-500': notice.type === 'success',
              'bg-blue-500': notice.type === 'info',
              'bg-orange-500': notice.type === 'warning',
              'bg-red-500': notice.type === 'error',
             }"
            style="pointer-events:all"
            x-text="notice.text">
          </div>
        </template>
      </div>

      </div>
    </template>
    </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
