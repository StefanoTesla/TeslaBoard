<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Log Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #161616;
    }
    h1 {
      color: #fff;
    }
    #log {
      width: 90%;
      height: 70%;
      overflow-y: auto;
      border: 1px solid #161616;
      background: #323232;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #log p {
      margin: 0;
      padding: 5px;
      font-size: 14px;
      color: #fff;
    }
    #log p.error {
      color: red;
    }
    #log p.warning {
      color: yellow;
    }

    .active {
      background-color: #4CAF50;
    }

    .button-container {
      display: flex;
      margin-bottom: 10px;
    }

    button {
      background-color: #323232;
      color: white;
      border: 1px solid #161616;
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }

    button.active {
      background-color: #4CAF50;
    }

    .container{
      @apply w-full h-full;
    }
  </style>
</head>
<body x-data="logViewer()">
  <div class="container">
    <h1>TeslaBoard Log Viewer</h1>

    <!-- Bottoni per selezionare i filtri -->
    <div class="button-container">
      <button :class="{ 'active': filter.board }" @click="toggleFilter('board')">Board</button>
      <button :class="{ 'active': filter.dome }" @click="toggleFilter('dome')">Dome</button>
      <button :class="{ 'active': filter.switch }" @click="toggleFilter('switch')">Switch</button>
      <button :class="{ 'active': filter.coverc }" @click="toggleFilter('coverc')">CoverC</button>
    </div>

    <div id="log">
      <!-- Ciclo sui log, ma solo quelli che passano il filtro -->
      <template x-for="log in filteredLogs" :key="log.id">
        <p :class="log.type" :data-machine="log.machine" x-text="log.message"></p>
      </template>
    </div>
  </div>

  <script>
    function logViewer() {
      return {
        logs: [],
        socket: null,
        nextId: 0,
        filter: {
          board: true,
          dome: true,
          coverc: true,
          switch: true
        },

        // Metodo per aggiungere un log
        addLog(message, type = 'info', machine = '0') {
          switch (parseInt(type)) {
            case 0:
              type = 'error';
              break;

            case 1:
              type = 'warning';
              break;
            case 2:
              type = 'info';
              break;
            case 3:
              type = 'debug';
              break;

            default:
              type = 'info';
              break;
          }

          switch (parseInt(machine)) {
            case 0:
              machine = 'board';
              break;
            case 1:
              machine = 'dome';
              break;
            case 2:
              machine = 'coverc';
              break;
            case 3:
              machine = 'switch';
              break;
            default:
              machine = 'board';
              break;
          }

          let d = new Date(); // Crea un'istanza di Date
          let timeString = d.toLocaleTimeString(); // Ora puoi usare toLocaleTimeString

          message = timeString + " [" + machine + "] " + message;
          this.logs.push({ id: this.nextId++, message, type, machine });

          // Mantieni visibile l'ultimo messaggio
          this.$nextTick(() => {
            const logDiv = document.getElementById('log');
            logDiv.scrollTop = logDiv.scrollHeight;
          });
        },

        connect() {
          this.socket = new WebSocket(`ws://172.20.10.10/ws`);
        },

        // Inizializza il WebSocket
        init() {
          this.connect();
          this.socket.onopen = () => {
            this.addLog('Connesso al WebSocket.', 0, 5);
          };

          this.socket.onmessage = (event) => {
            const parts = event.data.split('#');
            this.addLog(parts[2], parts[0], parts[1]);
          };

          this.socket.onclose = () => {
            this.addLog('Disconnesso dal WebSocket.', 'error');
            setTimeout(this.connect(), 1000);
          };

          this.socket.onerror = (error) => {
            this.addLog('Errore WebSocket.', 'error');
          };
        },

        // Toggle il filtro per ciascuna macchina
        toggleFilter(machine) {
          this.filter[machine] = !this.filter[machine];
        },

        // Computed property per filtrare i log
        get filteredLogs() {
          return this.logs.filter(log => {
            console.log(log.machine)
            // Controlla se il filtro per la macchina è attivo
            return this.filter[log.machine];
          });
        }
      };
    }
  </script>

  <script type="module" src="/main.js"></script>
</body>
</html>
